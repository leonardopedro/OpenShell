# nix.conf — the nixcache half of the sharing, rendered into sandboxes at
# /etc/nix/nix.conf via a read-only bind (run-sandbox mounts this directory).
#
# This is the podman counterpart of the VM driver's guest_nix_cache
# (inject_guest_nix_conf, guest-cache-design deltas 2+3): same fields, same
# defaults — substituters, trusted-substituters, trusted-public-keys,
# connect-timeout, fallback — delivered as a file rather than NIX_CONFIG env.
#
# Two substituters, in order of hope:
#   * the host's nix-serve (nix-serve.service, port 5000): every store path
#     the host already has is one LAN round-trip away, signed with
#     @CACHE_PUBKEY@ — this is the shared cache the design doc calls
#     "host nix-serve :5000". The sandbox reaches it through OpenShell's
#     policy layer; sandbox-policy.yaml allows exactly that one endpoint.
#   * cache.nixos.org as fallback: a path neither host nor local cache knows
#     still resolves, subject to the same (stricter, per-binary) policy —
#     egress stays denied until approved per-sandbox, here as on the VMs.
#
# Why the cache host is `host.openshell.internal` and NOT the machine's LAN
# name or IP (measured 2026-10-25, the first end-to-end run): podman copies
# the host's /etc/hosts into the workload container, so a LAN name that
# exists there is resolved *locally* by getaddrinfo — the query never
# reaches OpenShell's Policy DNS. The workload then connects to the bare IP,
# and a bare-IP connect is denied by design ("endpoint 10.0.0.108:5000 is
# not allowed by any policy"). `host.openshell.internal` is OpenShell's own
# alias: it is absent from the sandbox's /etc/hosts (so Policy DNS handles
# it and can match the nix_cache rule), it is the one name a policy is
# documented to allow onto the gateway host, and the supervisor already
# maps it to the host address (log: ip=10.0.0.108).
#
# Render (only the nix-serve public key is machine-specific; see README.md):
#   mkdir -p ~/.config/openshell/nix-conf
#   sed -e "s|@CACHE_PUBKEY@|$(cat ~/.config/nix-serve/cache-1.pub)|" \
#       nix.conf > ~/.config/openshell/nix-conf/nix.conf
substituters = http://host.openshell.internal:5000 https://cache.nixos.org
trusted-substituters = http://host.openshell.internal:5000 https://cache.nixos.org
trusted-public-keys = @CACHE_PUBKEY@ cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
connect-timeout = 5
fallback = true
