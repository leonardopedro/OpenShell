# GPU-backed Edge0 provider profile: the model runs on the gateway host's GPU
# (Vulkan) and sandboxes reach it over vsock. The GPU itself is never handed to
# the guest — no VFIO binding, no driver in the sandbox image. That is
# deliberate: the OpenShell VM image ships no NVIDIA userspace, so a
# passed-through card would be visible but unusable, while keeping the model
# server on the host means one loaded model serves every sandbox.
#
#   openshell provider profile lint   -f providers/edge0-openai-gpu.yaml
#   openshell provider profile import -f providers/edge0-openai-gpu.yaml --global
#
# Pairs with `SANDBOX_GPU=1 openshell-nixos/infinity-sandbox`, which selects
# this profile and probes the endpoint before creating the sandbox.
#
# Client binaries:   infinity-provider-openai (the Infinity provider process
#                    that calls the model server) and curl for smoke tests.
# Reference layout:  /nix/store/*-infinity/bin from the launcher's store bake,
#                    /sandbox/.local/bin, /usr/local/bin, or ~/.cargo/bin.
# Credential scope:  none. The Edge0 server is credentialed with a local token,
#                    passed to the workload as INFINITY_OPENAI_API_KEY via
#                    `sandbox create --env` (or `--env-from`).
# Endpoint access:   the Edge0 `edge0-infer serve` OpenAI-compatible API on the
#                    gateway host, port 8001, read-write. Port 8001 (not 8000)
#                    so a GPU server and a CPU server can run side by side and
#                    a sandbox picks one by profile name.
# Smoke test:        openshell sandbox create --provider edge0-gpu -- \
#                      curl -sS http://host.openshell.internal:8001/v1/models
#
# Start the GPU model server on the gateway host (non-loopback, so the sandbox
# can reach it; a key file is mandatory off loopback):
#   GGML_VK_VISIBLE_DEVICES=1 edge0-infer serve --model "$MOE_ASSETS_35B" \
#     --device vulkan --model-option expert_slots=24 \
#     --host 0.0.0.0 --port 8001 --api-key-file ~/.edge0/api-key
#
# `GGML_VK_VISIBLE_DEVICES=1` hides a second Vulkan device (an Intel iGPU
# aborts the engine with vk::DeviceLostError instead of falling back);
# `expert_slots=24` keeps the 16K context in ~5 GiB of VRAM on a 6 GiB card.

id: edge0-gpu
display_name: Edge0 35B (host GPU, Vulkan)
description: Host-local Edge0 edge0-infer on the gateway host's GPU (Vulkan backend)
category: inference
inference_capable: true
credentials: []
endpoints:
  - host: host.openshell.internal
    port: 8001
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  # openshell-nixos/infinity-sandbox: the binary is a host Nix store path
  # (content-addressed, so the hash is matched, not spelled out).
  - /nix/store/*-infinity/bin/infinity-provider-openai
  # `sandbox upload` installs here; allow it for upload-based deployments.
  - /sandbox/bin/infinity-provider-openai
  - /sandbox/.local/bin/infinity-provider-openai
  - /usr/local/bin/infinity-provider-openai
  - /sandbox/.cargo/bin/infinity-provider-openai
  - /root/.cargo/bin/infinity-provider-openai
  - /usr/bin/curl
  - /usr/local/bin/curl
