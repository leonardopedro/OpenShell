name: Packaging Verify

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:

env:
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: gate
        uses: ./.github/actions/pr-gate

  packaging_changes:
    name: Detect packaging changes
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.default.outputs.should_run || steps.changes.outputs.any_changed }}
    steps:
      - id: default
        if: github.event_name != 'push'
        shell: bash
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'

      - id: merge-base
        if: github.event_name == 'push'
        uses: ./.github/actions/pr-merge-base
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - id: changes
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@aa08304bd477b800d468db44fe10f6c61f7f7b11 # v42.1.0
        with:
          base_sha: ${{ steps.merge-base.outputs.base_sha }}
          skip_initial_fetch: ${{ steps.merge-base.outputs.base_sha != '' }}
          files: |
            openshell.spec
            .packit.yaml
            deploy/deb/**
            deploy/rpm/**
            tasks/package.toml
            tasks/scripts/package-deb.sh
            tasks/scripts/package-deb-install.sh
            tasks/scripts/test-packaging-assets.sh
            tasks/scripts/verify-packages.sh
            .github/workflows/packaging-verify.yml

  packaging-verify:
    name: Verify Package Payloads
    needs: [pr_metadata, packaging_changes]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.packaging_changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The payload check only needs executables of the right names, so the
      # script's throwaway stubs keep this job independent of the Rust builds.
      - name: Build and inspect both packages
        run: tasks/scripts/verify-packages.sh
